    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --yellow: #4d99fe;
      --yellow-dim: rgba(77, 153, 254, 0.10);
      --yellow-border: rgba(77, 153, 254, 0.22);
      --wc-red: #E8231A;
      --wc-green: #1A7A3C;
      --wc-blue: #1A3F8F;
      --bg: #080808;
      --bg-card: #0c0c0c;
      --text: #F2EFE5;
      --text-muted: #606060;
      --text-mid: #9e9b90;
      --border: #1c1c1c;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* grain */
